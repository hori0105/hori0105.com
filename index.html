
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="hori / ホリのプロフィールと活動情報">
  <title>hori/ホリの取扱説明書</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      color: #222;
      background: #fff;
      line-height: 1.8;
    }

    header, main, footer {
      width: min(900px, 90%);
      margin: auto;
    }

    header {
      padding: 24px 0;
      border-bottom: 1px solid #eee;
    }

    .brand {
      font-size: 1.3rem;
      font-weight: 750;
      text-decoration: none;
      color: #222;
    }

    .hero {
      padding: 100px 0 70px;
    }

    .eyebrow {
      color: #777;
      letter-spacing: .12em;
      font-size: .85rem;
    }

    h1 {
      font-size: clamp(2.2rem, 7vw, 4rem);
      line-height: 1.25;
      letter-spacing: -.04em;
    }

    .lead { color: #666; }

    section { padding: 35px 0; }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
    }

    .link-card {
      display: block;
      padding: 22px;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      transition: background .2s;
    }

    .link-card:hover { background: #f7f7f7; }

    .link-card strong { display: block; }

    .link-card span { color: #777; font-size: .9rem; }

    footer {
      margin-top: 60px;
      padding: 25px 0;
      border-top: 1px solid #eee;
      color: #888;
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">hori/ホリ</a>
  </header>

  <main>
    <div class="hero">
      <p class="eyebrow">WELCOME TO MY WEBSITE</p>
      <h1>hori/ホリの取扱説明書。</h1>
      <p class="lead">
        ゲーム、動画、日々の活動。<br>
        horiについてまとめた個人サイトです。
      </p>
    </div>

    <section>
      <h2>PROFILE</h2>
      <p>
        hori/ホリ<br>
        ゲーム実況やオンラインでの活動をしています。
      </p>
    </section>

    <section>
      <h2>LINKS</h2>
      <div class="links">
        <a class="link-card"
           href="https://youtube.com/@hori0105"
           target="_blank" rel="noopener noreferrer">
          <strong>YouTube ↗</strong>
          <span>動画・ゲーム実況</span>
        </a>

        <a class="link-card"
           href="https://x.com/hori0105"
           target="_blank" rel="noopener noreferrer">
          <strong>X / SNS ↗</strong>
          <span>日々の更新</span>
        </a>

        <a class="link-card" href="mailto:contact@hori0105.com">
          <strong>CONTACT ↗</strong>
          <span>お問い合わせ</span>
        </a>
      </div>
    </section>
  </main>

  <footer>
    © hori0105.com
  </footer>
</body>
</html>

</body>
</html>
